# Deprecated: nginx-gateway is defined in compose.yml and compose-external-only.yml.
# This file is kept for reference if you need a gateway-only overlay on a custom stack.
#
#   docker compose -f your.yml -f compose.gateway.yml up -d
#
# Ensure dwani-server has no host ports (use expose: 18888 only).

services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: dwani_nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dwani-server
    restart: unless-stopped
