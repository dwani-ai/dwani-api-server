services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: dwani_nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dwani-server
    restart: unless-stopped

  dwani-server:
    image: dwani/api-server:latest  # Replace with your FastAPI Docker image
    container_name: dwani_api_server
    expose:
      - "18888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tts-indic-server
      - vllm-server
    environment:
      - HF_TOKEN=hf_this_is_a_valid_token_for_not_google
      - API_KEY_SECRET=dwani-very-secret-key-please-dont-tell-anyone
      - CHAT_RATE_LIMIT=100/minute
      - DWANI_API_BASE_URL_LLM=http://vllm-server:10802/v1
      - DWANI_API_BASE_URL_TTS=http://tts-indic-server:10804
      - DWANI_API_BASE_URL_S2S=http://host.docker.internal:7861
      - SPEECH_RATE_LIMIT=5/minute
      - ENCRYPTION_KEY=tete
      - DEFAULT_ADMIN_USER=this_is_default_amdin
      - DEFAULT_ADMIN_PASSWORD=not_default_admin
      # Set to 0 or remove for local /docs and OpenAPI
      - DISABLE_API_DOCS=1
    restart: unless-stopped

  tts-indic-server:
    image: dwani/tts-indic-server:latest
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    expose:
      - "10804"
    restart: unless-stopped
    environment:
      - HF_TOKEN
      - TTS_NFE_STEPS=8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
  vllm-server:
    image: dwani/vllm-gemma4-audio
    container_name: gemma4-vllm-server-1
    # CRITICAL: L4 GPUs need shared memory for Triton/NCCL kernels to initialize without hanging.
    shm_size: '4gb'
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Use your shell's HF_TOKEN or replace ${HF_TOKEN} with your actual key
      - HF_TOKEN=${HF_TOKEN}
      # Required for some nightly builds to avoid library pathing issues
      - LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    ports:
      - "10802:10802"
    volumes:
      # Mount a local cache so you don't re-download 15GB+ every time you restart
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    command: >
      --model google/gemma-4-E2B-it
      --served-model-name gemma4
      --host 0.0.0.0
      --port 10802
      --trust-remote-code
      --enforce-eager
      --gpu-memory-utilization 0.85
      --max-model-len 8192
      --max-num-seqs 16
      --enable-chunked-prefill
      --enable-prefix-caching
      --chat-template-content-format openai
      --tool-call-parser gemma4
      --reasoning-parser gemma4
      --enable-auto-tool-choice
      --limit-mm-per-prompt '{"image":2,"video":1,"audio":1}'
      --default-chat-template-kwargs '{"enable_thinking": false}'