# API + nginx gateway only. Point LLM/TTS/S2S at services on the host (or elsewhere)
# via host.docker.internal. Adjust ports to match your host bindings.

services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: dwani_nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dwani-server
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dwani-server:
    image: dwani/api-server:latest  # Replace with your FastAPI Docker image
    container_name: dwani_api_server
    expose:
      - "18888"
    environment:
      - HF_TOKEN=hf_this_is_a_valid_token_for_not_google
      - API_KEY_SECRET=dwani-very-secret-key-please-dont-tell-anyone
      - CHAT_RATE_LIMIT=100/minute
      # Host ports must match where vLLM / TTS listen on the machine running Docker
      - DWANI_API_BASE_URL_LLM=http://host.docker.internal:10802/v1
      - DWANI_API_BASE_URL_TTS=http://host.docker.internal:10804
      - DWANI_API_BASE_URL_S2S=http://host.docker.internal:7861
      - SPEECH_RATE_LIMIT=5/minute
      - ENCRYPTION_KEY=tete
      - DEFAULT_ADMIN_USER=this_is_default_amdin
      - DEFAULT_ADMIN_PASSWORD=not_default_admin
      - DISABLE_API_DOCS=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
